const TAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const raster = document.getElementById("raster");
const titel = document.getElementById("titel");

function montagVon(d) {
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function kurz(d) {
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.`;
}
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - tag);
  const jahresanfang = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - jahresanfang) / 86400000 + 1) / 7);
}
function farbe(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 65% 50%)`;
}
function zeige(montag) {
  const sonntag = new Date(montag.getFullYear(), montag.getMonth(), montag.getDate() + 6);
  titel.textContent = `KW ${kalenderwoche(montag)} · ${kurz(montag)}–${kurz(sonntag)}`;
  const heute = iso(new Date());
  const spalten = [];
  for (let i = 0; i < 7; i++) {
    const tag = new Date(montag.getFullYear(), montag.getMonth(), montag.getDate() + i);
    const schluessel = iso(tag);
    const spalte = document.createElement("section");
    spalte.className = "tag" + (schluessel === heute ? " heute" : "");
    const kopf = document.createElement("h2");
    kopf.textContent = `${TAGE[i]} ${kurz(tag)}`;
    spalte.append(kopf);
    const liste = TERMINE.filter((t) => t.datum === schluessel);
    if (!liste.length) {
      const leer = document.createElement("p");
      leer.className = "leer";
      leer.textContent = "keine Termine";
      spalte.append(leer);
    }
    for (const t of liste) {
      const karte = document.createElement("div");
      karte.className = "termin";
      karte.style.setProperty("--c", farbe(t.name));
      const zeit = document.createElement("div");
      zeit.className = "zeit";
      zeit.textContent = t.zeit;
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = t.name;
      karte.append(zeit, name);
      if (t.ort) {
        const ort = document.createElement("div");
        ort.className = "ort";
        ort.textContent = "📍 " + t.ort;
        karte.append(ort);
      }
      spalte.append(karte);
    }
    spalten.push(spalte);
  }
  raster.replaceChildren(...spalten);
}

let aktuell = montagVon(new Date());
zeige(aktuell);
document.getElementById("zurueck").onclick = () => {
  aktuell = new Date(aktuell.getFullYear(), aktuell.getMonth(), aktuell.getDate() - 7);
  zeige(aktuell);
};
document.getElementById("weiter").onclick = () => {
  aktuell = new Date(aktuell.getFullYear(), aktuell.getMonth(), aktuell.getDate() + 7);
  zeige(aktuell);
};
document.getElementById("heute").onclick = () => {
  aktuell = montagVon(new Date());
  zeige(aktuell);
};
